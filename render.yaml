services:
  - type: web
    name: payor-simul
    runtime: node
    plan: starter            # un disque persistant exige au moins le plan Starter
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /sante
    disk:
      name: donnees
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_LOGIN
        sync: false          # à renseigner dans le tableau de bord Render
      - key: ADMIN_MDP
        sync: false
      - key: ADMIN_NOM
        sync: false
